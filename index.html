<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Jóse M.</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0b0d12; color: #f3f4f6; padding: 24px 20px; }
    header, .grid { max-width: 1440px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 1.75rem; font-weight: 800; }
    .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .tab { background: #151922; border: 1px solid #262c3a; color: #9ca3af; padding: 9px 18px; border-radius: 22px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .tab:hover { color: #fff; border-color: #4b5563; }
    .tab.active { background: #e50914; color: #fff; border-color: #e50914; }
    .tab-fav.active { background: #f59e0b; color: #0b0d12; border-color: #f59e0b; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
    input, select { background: #151922; color: #fff; border: 1px solid #262c3a; padding: 11px 15px; border-radius: 9px; font-size: 14px; outline: none; }
    input { flex: 1; min-width: 250px; }
    input:focus, select:focus { border-color: #e50914; }
    .stats { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 22px; }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #151922; border: 1px solid #262c3a; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; padding: 16px; gap: 14px; transition: transform 0.2s; }
    .card:hover { transform: translateY(-3px); border-color: #3b4458; }
    .card-top { display: flex; gap: 16px; align-items: flex-start; }
    .poster { flex: 0 0 135px; aspect-ratio: 2 / 3; border-radius: 9px; overflow: hidden; background: linear-gradient(135deg, #1a202c 0%, #0f131a 100%); display: flex; align-items: center; justify-content: center; border: 1px solid #262c3a; }
    .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .no-img-text { padding: 10px; text-align: center; font-weight: 700; color: #64748b; font-size: 12px; }
    .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
    .b-cat { background: #e50914; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
    .b-fol { background: #1f2937; color: #cbd5e1; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; border: 1px solid #374151; }
    .fav-btn { margin-left: auto; background: #1f2937; color: #9ca3af; border: 1px solid #374151; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .fav-btn:hover { color: #fff; border-color: #6b7280; }
    .fav-btn.is-fav { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border-color: #f59e0b; }
    .title { font-size: 18px; font-weight: 800; margin-bottom: 4px; color: #fff; line-height: 1.25; }
    .genre { font-size: 12px; color: #60a5fa; font-weight: 600; margin-bottom: 6px; }
    .credits { font-size: 12px; color: #9ca3af; margin-bottom: 8px; }
    .credits b { color: #e5e7eb; }
    .sinopsis-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #9ca3af; margin-bottom: 3px; }
    .sinopsis { font-size: 13px; color: #d1d5db; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .cast-section { border-top: 1px solid #262c3a; padding-top: 12px; }
    .cast-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #9ca3af; margin-bottom: 8px; }
    .cast-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
    .actor { flex: 0 0 64px; text-align: center; }
    .actor img { width: 56px; height: 100px; border-radius: 8px; object-fit: cover; border: 1px solid #374151; background: #1f2937; margin: 0 auto 4px; display: block; }
    .actor-placeholder { width: 56px; height: 100px; border-radius: 8px; background: #1f2937; border: 1px solid #374151; margin: 0 auto 4px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #9ca3af; font-weight: bold; }
    .actor span { display: block; font-size: 11px; color: #e5e7eb; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .btn { text-align: center; background: #2481cc; color: #fff; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px; transition: 0.2s; margin-top: auto; }
    .btn:hover { background: #1b66a3; }
    .load-more { display: block; margin: 30px auto; padding: 12px 28px; background: #151922; color: #fff; border: 1px solid #262c3a; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .b-new { background: #10b981; color: #052e16; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 800; }
    .btn-rnd { background: #7c3aed; color: #fff; border: 1px solid #8b5cf6; padding: 11px 15px; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-rnd:hover { background: #6d28d9; }
    .b-fold { display: none !important; }
  </style>
</head>
<body>
<header>
  <div class="top"><h1>🎬 Catálogo de Jóse M.</h1></div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="Todos">Todos</button>
    <button class="tab" data-cat="Películas">1. La Videoteca</button>
    <button class="tab" data-cat="Series">2. La Serieteca</button>
    <button class="tab" data-cat="Sagas">3. Sagas</button>
    <button class="tab" data-cat="Series Clásicas">4. Series Clásicas TV</button>
    <button class="tab tab-fav" data-cat="Favoritas" id="tabFav">⭐ Mis Favoritas (0)</button>
  </div>
  <div class="controls">
    <input type="text" id="search" placeholder="Buscar por título, actor, director o sinopsis...">
    <select id="folder"><option value="">Todas las carpetas / temas</option></select>
    <select id="genre"><option value="">Todos los géneros</option></select>
    <button type="button" class="btn-rnd" id="rndBtn">🎲 ¿Qué veo hoy?</button>
  </div>
  <div class="stats" id="stats">Cargando...</div>
</header>
<main class="grid" id="grid"></main>
<button class="load-more" id="moreBtn" style="display:none;">Cargar más títulos</button>
<footer style="text-align:center; color:#6b7280; font-size:12px; margin-top:40px; padding-bottom:20px;">Datos e imágenes proporcionados por TMDB</footer>
<script>
const URL_CSV = "datos.csv";
const STORAGE_FAV = "catalogo_jose_favoritas_v1";
const LF = String.fromCharCode(10);
const CR = String.fromCharCode(13);
const BOM = String.fromCharCode(65279);
const REGEX_NUMS = new RegExp("[0-9]+", "g");
const REGEX_GEN = new RegExp("[|·#]", "g");

let datos = new Array();
let filtrados = new Array();
let catActual = "Todos";
let limite = 60;
let favoritas = new Array();

try { const raw = localStorage.getItem(STORAGE_FAV); if (raw) favoritas = JSON.parse(raw); } catch (e) {}

const grid = document.getElementById("grid");
const stats = document.getElementById("stats");
const search = document.getElementById("search");
const folder = document.getElementById("folder");
const genre = document.getElementById("genre");
const moreBtn = document.getElementById("moreBtn");
const tabFav = document.getElementById("tabFav");

function actualizarContadorFav() { tabFav.textContent = "⭐ Mis Favoritas (" + favoritas.length + ")"; }

function toggleFavorita(id) {
  const idx = favoritas.indexOf(id);
  if (idx === -1) favoritas.push(id);
  else favoritas.splice(idx, 1);
  try { localStorage.setItem(STORAGE_FAV, JSON.stringify(favoritas)); } catch (e) {}
  actualizarContadorFav();
  if (catActual === "Favoritas") aplicarFiltros();
  else pintar();
}

function parseCSV(str) {
  const arr = new Array();
  let quote = false, row = new Array(), col = "";
  for (let c = 0; c < str.length; c++) {
    let cc = str.charAt(c), nc = str.charAt(c + 1);
    if (cc === '"' && quote && nc === '"') { col += cc; ++c; continue; }
    if (cc === '"') { quote = !quote; continue; }
    if (cc === ',' && !quote) { row.push(col); col = ""; continue; }
    if (cc === CR && nc === LF && !quote) { row.push(col); arr.push(row); col = ""; row = new Array(); ++c; continue; }
    if ((cc === LF || cc === CR) && !quote) { row.push(col); arr.push(row); col = ""; row = new Array(); continue; }
    col += cc;
  }
  if (col || row.length) { row.push(col); arr.push(row); }
  return arr;
}
actualizarContadorFav();

fetch(URL_CSV + "?v=" + Date.now())
  .then(function(r) { if (!r.ok) throw new Error("Error HTTP " + r.status); return r.text(); })
  .then(function(text) {
    const filas = parseCSV(text);
    const primeraFila = filas.shift() || new Array();
    const cab = primeraFila.map(function(h) { return h.split(BOM).join("").trim(); });
    datos = filas.filter(function(r) { return r.length >= 2; }).map(function(r) {
      let obj = {};
      cab.forEach(function(k, i) { const val = r.slice(i, i + 1).join(""); obj[k] = val ? val.trim() : ""; });
      if (obj.Enlace) {
        const nums = obj.Enlace.match(REGEX_NUMS);
        if (nums && nums.length >= 2) {
          const canal = nums.slice(0, 1).join("");
          const p1 = nums.slice(1, 2).join("");
          const p2 = nums.slice(2, 3).join("");
          obj.Enlace = p2
            ? "tg://privatepost?channel=" + canal + "&thread=" + p1 + "&post=" + p2
            : "tg://privatepost?channel=" + canal + "&post=" + p1;
        }
      }
      obj._esNuevo = false;
      obj._id = (obj.Categoría || "") + "|" + (obj.Título || "") + "|" + (obj.Enlace || "");
      return obj;
    }).reverse();
    datos.slice(0, 20).forEach(function(item) { item._esNuevo = true; });
    cargarFiltros();
    aplicarFiltros();
  })
  .catch(function(err) { stats.textContent = "Error: " + err.message; });

function cargarFiltros() {
  Array.from(new Set(datos.map(function(d) { return d.Carpeta; }).filter(Boolean))).sort().forEach(function(c) {
    const opt = document.createElement("option"); opt.value = c; opt.textContent = c; folder.appendChild(opt);
  });
  const genSet = new Set();
  datos.forEach(function(d) {
    if (d.Género) d.Género.split(REGEX_GEN).forEach(function(g) { const clean = g.split("_").join(" ").trim(); if (clean.length > 2) genSet.add(clean); });
  });
  Array.from(genSet).sort().forEach(function(g) {
    const opt = document.createElement("option"); opt.value = g; opt.textContent = g; genre.appendChild(opt);
  });
}

function aplicarFiltros() {
  const q = search.value.toLowerCase(), f = folder.value, g = genre.value.toLowerCase();
  filtrados = datos.filter(function(d) {
    const okCat = catActual === "Favoritas" ? favoritas.indexOf(d._id) !== -1 : (catActual === "Todos" || d.Categoría === catActual);
    const okFol = !f || d.Carpeta === f;
    const genNorm = (d.Género || "").split("_").join(" ").toLowerCase();
    const okGen = !g || genNorm.includes(g);
    const texto = ((d.Título || "") + " " + (d.Director || "") + " " + (d.Reparto || "") + " " + (d.Sinopsis || "")).split("_").join(" ").toLowerCase();
    return okCat && okFol && okGen && (!q || texto.includes(q));
  });
  limite = 60; pintar();
}

function pintarCast(d) {
  if (!d.Reparto_Fotos) {
    const rep = (d.Reparto || "").split("#").join("").split("_").join(" ");
    return rep ? '<div class="cast-section"><div class="cast-title">Reparto principal</div><div class="credits">' + rep + '</div></div>' : "";
  }
  const items = d.Reparto_Fotos.split("||").map(function(par) {
    const partes = par.split("::");
    const nombre = (partes.slice(0, 1).join("") || "").trim(), foto = (partes.slice(1, 2).join("") || "").trim();
    if (!nombre) return "";
    const media = foto ? '<img src="' + foto + '" loading="lazy" alt="' + nombre + '">' : '<div class="actor-placeholder">' + nombre.charAt(0).toUpperCase() + '</div>';
    return '<div class="actor">' + media + '<span>' + nombre + '</span></div>';
  }).join("");
  return '<div class="cast-section"><div class="cast-title">Reparto principal</div><div class="cast-row">' + items + '</div></div>';
}

function pintar() {
  const trozo = filtrados.slice(0, limite);
  stats.textContent = (catActual === "Favoritas" && filtrados.length === 0)
    ? "Aún no tienes títulos guardados. Pulsa '☆ Seguir' en cualquier ficha para añadirla aquí."
    : "Mostrando " + trozo.length + " de " + filtrados.length + " títulos";
  grid.innerHTML = trozo.map(function(d, index) {
    const dir = (d.Director || "").split("#").join("").split("_").join(" ");
    const gen = (d.Género || "").split("#").join("").split("_").join(" ");
    const esFav = favoritas.indexOf(d._id) !== -1;
    const imgHtml = d.Imagen ? '<img src="' + d.Imagen + '" loading="lazy" alt="' + (d.Título || '') + '">' : '<span class="no-img-text">🎬 ' + (d.Título || '') + '</span>';
    return '<article class="card"><div class="card-top"><div class="poster">' + imgHtml + '</div><div class="info"><div class="badges"><span class="b-cat">' + (d.Categoría || "") + '</span>' + (d._esNuevo ? '<span class="b-new">🆕 NOVEDAD</span>' : '') + '<span class="b-fol">📁 ' + (d.Carpeta || "") + '</span><button type="button" class="fav-btn' + (esFav ? ' is-fav' : '') + '" data-idx="' + index + '">' + (esFav ? '⭐ Siguiendo' : '☆ Seguir') + '</button></div><div class="title">' + (d.Título || "") + '</div>' + (gen ? '<div class="genre">' + gen + '</div>' : '') + (dir ? '<div class="credits"><b>Dirección:</b> ' + dir + '</div>' : '') + (d.Sinopsis ? '<div class="sinopsis-label">Vista general</div><p class="sinopsis">' + d.Sinopsis + '</p>' : '') + '</div></div>' + pintarCast(d) + '<a href="' + (d.Enlace || '#') + '" class="btn">▶ Abrir en Telegram</a></article>';
  }).join("");
  grid.querySelectorAll(".fav-btn").forEach(function(btn) {
    btn.onclick = function() {
      const idx = parseInt(btn.getAttribute("data-idx"), 10);
      const item = trozo.slice(idx, idx + 1).shift();
      if (item) toggleFavorita(item._id);
    };
  });
  moreBtn.style.display = limite < filtrados.length ? "block" : "none";
}

document.querySelectorAll(".tab").forEach(function(b) {
  b.onclick = function() { document.querySelector(".tab.active").classList.remove("active"); b.classList.add("active"); catActual = b.dataset.cat; aplicarFiltros(); };
});
search.oninput = aplicarFiltros; folder.onchange = aplicarFiltros; genre.onchange = aplicarFiltros;
document.getElementById("rndBtn").onclick = function() {
  if (!filtrados.length) return;
  const elegido = filtrados[Math.floor(Math.random() * filtrados.length)];
  stats.textContent = "🎲 Sugerencia al azar (pulsa de nuevo para otra o cambia de pestaña/filtro para volver):";
  const copia = filtrados;
  filtrados = [elegido];
  limite = 1;
  pintar();
  filtrados = copia;
};
moreBtn.onclick = function() { limite += 60; pintar(); };
</script>
<script data-goatcounter="https://catalogojose.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
